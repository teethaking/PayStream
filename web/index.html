<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PayStream: payroll that streams by the second, with an AI agent that physically cannot overspend. Built on QDay Aevum testnet." />
    <meta name="theme-color" content="#07080C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PayStream · Payroll that streams by the second</title>
    <script>
      try {
        const t = localStorage.getItem('ps-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
