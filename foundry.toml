[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "shanghai"   # Aevum is a cdk-erigon zkEVM on the Shanghai fork
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"

[invariant]
runs = 256
depth = 64
fail_on_revert = false
